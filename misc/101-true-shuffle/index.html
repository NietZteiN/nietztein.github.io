<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>True Shuffle</title>
<meta name="description" content="A music player for your own YouTube playlists and Liked videos: browse by artist, genre, mood and the anime or game a song is from, and shuffle it properly. A demo library runs without signing in.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../_kit/kit.css"><script src="../_kit/kit.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body class="ts">

<header class="kit-header ts-top">
	<h1 class="ts-brand"><a href="#/" class="ts-brand-link"><span class="ts-logo" aria-hidden="true"></span><span class="ts-brand-name">True Shuffle</span></a></h1>
	<p class="kit-sub kit-sr">Your YouTube playlists, in the order you ask for.</p>
	<div class="ts-histnav kit-nothumb">
		<button class="ts-icon-btn" id="nav-back" type="button" aria-label="Back" title="Back"></button>
		<button class="ts-icon-btn" id="nav-fwd" type="button" aria-label="Forward" title="Forward"></button>
	</div>
	<button class="ts-focus kit-nothumb" id="focus-btn" type="button" aria-haspopup="menu" title="Work inside a playlist"></button>
	<form class="ts-search" id="search-form" role="search">
		<label class="kit-sr" for="search">Search songs, artists, genres and anime</label>
		<span class="ts-search-icon" aria-hidden="true"></span>
		<input id="search" type="search" placeholder="Search songs, artists, anime, moods" autocomplete="off" spellcheck="false">
		<kbd class="ts-search-kbd" aria-hidden="true">/</kbd>
	</form>
</header>

<div class="ts-app" id="app">

	<nav class="ts-side" id="side" aria-label="Sections">
		<ul class="ts-nav" id="nav"></ul>
		<div class="ts-side-sec">
			<h2 class="ts-side-h">Playlists</h2>
			<ul class="ts-stations" id="stations"></ul>
		</div>
		<p class="ts-side-legal kit-nothumb">Uses YouTube API Services &middot; <a href="https://www.youtube.com/t/terms" rel="noopener">Terms</a> &middot; <a href="https://policies.google.com/privacy" rel="noopener">Privacy</a></p>
	</nav>

	<main class="ts-main" id="main" tabindex="-1">
		<p class="ts-demo kit-nothumb" id="demo-banner" hidden><b>Demo.</b> <span id="demo-text"></span> <a href="./">Leave the demo</a></p>
		<div class="ts-notice kit-nothumb" id="stale" hidden>
			<p id="stale-text"></p>
			<div class="kit-row"><button class="kit-btn small" id="stale-signin" type="button">Sign in to refresh</button><a class="kit-btn small" href="#/settings">Delete instead</a></div>
		</div>
		<div id="view" class="ts-view"></div>
	</main>

	<aside class="ts-now" id="now" aria-label="Now playing and queue">
		<div class="ts-resizer kit-nothumb" id="now-resizer" role="separator" aria-orientation="vertical" aria-label="Width of the now playing panel: drag, or use the arrow keys; double-click to reset" tabindex="0"></div>
		<!-- The player box: visible, never under 200 by 200 px, YouTube's own controls. -->
		<div class="ts-video" id="video">
			<div class="ts-player" id="player">
				<button class="ts-poster" id="poster" type="button"><span class="ts-poster-art" id="poster-art" aria-hidden="true"></span><span class="ts-poster-play" aria-hidden="true"></span><span class="ts-poster-text" id="poster-text">Press play</span></button>
			</div>
			<span class="ts-demo-tag" id="demo-tag" hidden>Demo &middot; no sound</span>
			<div class="ts-vbar kit-nothumb" id="vbar" role="group" aria-label="Player size"></div>
		</div>
		<div class="ts-now-rest" id="now-rest">
			<div class="ts-sheet-grip kit-nothumb"><button class="ts-icon-btn" id="sheet-close" type="button" aria-label="Close the queue"></button></div>
			<section class="ts-nowinfo" id="nowinfo" aria-label="This track"></section>
			<section class="ts-queue" aria-label="Queue">
				<div class="ts-tabs" role="tablist" aria-label="Queue and history">
					<button class="ts-tab" id="tab-next" type="button" role="tab" aria-selected="true" aria-controls="panel-next">Up next</button>
					<button class="ts-tab" id="tab-history" type="button" role="tab" aria-selected="false" aria-controls="panel-history" tabindex="-1">Played</button>
					<span class="ts-tabs-sp"></span>
					<button class="ts-link-btn kit-nothumb" id="btn-save-queue" type="button" title="Save what is queued as a playlist">Save</button>
					<button class="ts-link-btn kit-nothumb" id="btn-clear-queue" type="button">Clear</button>
				</div>
				<div id="panel-next" role="tabpanel" aria-labelledby="tab-next">
					<p class="ts-context" id="queue-context"></p>
					<div class="ts-qmode kit-nothumb" id="queue-mode"></div>
					<ol class="ts-qlist" id="queue"></ol>
					<p class="ts-muted ts-qmore" id="queue-more"></p>
				</div>
				<div id="panel-history" role="tabpanel" aria-labelledby="tab-history" hidden>
					<ol class="ts-qlist" id="history"></ol>
					<p class="ts-muted ts-qmore" id="history-more"></p>
				</div>
			</section>
		</div>
	</aside>

	<footer class="ts-bar" id="bar" aria-label="Player">
		<div class="ts-bar-track" id="bar-track"></div>
		<div class="ts-bar-mid">
			<div class="ts-transport" role="group" aria-label="Playback">
				<button class="ts-modepill" id="btn-mode" type="button" aria-haspopup="menu" title="How the next songs are chosen (o)"></button>
				<button class="ts-icon-btn" id="btn-prev" type="button" aria-label="Previous track" title="Previous (p)"></button>
				<button class="ts-play" id="btn-toggle" type="button" aria-label="Play" title="Play or pause (space)"></button>
				<button class="ts-icon-btn" id="btn-next" type="button" aria-label="Next track" title="Next (n)"></button>
				<button class="ts-icon-btn" id="btn-reshuffle" type="button" aria-label="Shuffle again" title="Shuffle what comes next again (s)"></button>
				<button class="ts-icon-btn" id="btn-repeat" type="button" aria-label="Repeat the queue" aria-pressed="false" title="Repeat the queue (r)"></button>
			</div>
			<div class="ts-seek" id="seekbox">
				<span class="ts-seektip" id="seektip" hidden></span>
				<span class="ts-time" id="time-cur">0:00</span>
				<input class="ts-range" id="seek" type="range" min="0" max="1" step="1" value="0" aria-label="Position in the track" disabled>
				<span class="ts-time" id="time-dur">0:00</span>
			</div>
		</div>
		<div class="ts-bar-right">
			<button class="ts-icon-btn" id="btn-like" type="button" aria-label="Like" aria-pressed="false" title="Like (l)"></button>
			<div class="ts-vol" role="group" aria-label="Volume">
				<button class="ts-icon-btn" id="btn-mute" type="button" aria-label="Mute" aria-pressed="false" title="Mute (m)"></button>
				<input class="ts-range ts-volrange" id="vol" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">
			</div>
			<button class="ts-icon-btn" id="btn-theater" type="button" aria-label="Theater mode: a big video" aria-pressed="false" title="Theater mode (t)"></button>
			<button class="ts-icon-btn" id="btn-sleep" type="button" aria-label="Sleep timer" aria-pressed="false" aria-haspopup="menu" title="Sleep timer"></button>
			<button class="ts-icon-btn" id="btn-edit-now" type="button" aria-label="Edit this track's details" title="Edit details (e)"></button>
			<button class="ts-icon-btn" id="btn-queue" type="button" aria-label="Show the queue" aria-pressed="false" title="Queue (q)"></button>
		</div>
	</footer>

	<nav class="ts-tabbar" id="tabbar" aria-label="Sections"></nav>
</div>

<p class="kit-sr" id="status" role="status" aria-live="polite"></p>

<template id="help-template">
	<p>A music player for your own YouTube playlists and Liked videos. Sign in under <b>Settings</b>, import your lists, then browse and listen like in any music app. <a href="?demo=1">The demo</a> shows everything on an invented library with a player that only advances a clock.</p>
	<h3>Finding music</h3>
	<p>Browse by <b>artist</b>, by <b>genre</b> (grouped in families), by <b>mood</b>, by <b>scene</b> (anime, visual novels, VTubers, Vocaloid&hellip;) and by the <b>anime, game or musical</b> a song is from. Search finds titles in any script, romaji, artists and works. Every page has <b>Play</b> (in order) and <b>Shuffle</b>; <b>Radio</b> on a song plays others that sound like it.</p>
	<h3>Shuffling</h3>
	<p><b>True shuffle</b> gives every order the same chance and repeats nothing until the whole selection has played, also after a reload. The mode button left of Play changes how the next tracks are chosen: spread artists apart, fresh first, favourites, rediscover, artist rotation, genre blocks, newest first. <b>Mix builder</b> combines filters, limits and the order, and saves them as stations.</p>
	<h3>Labels</h3>
	<p>Every track can carry hand-made labels: artist, title, genres, mood, scene, the work it is from and its role there (OP, ED&hellip;), language and kind. Edit one track with <kbd>e</kbd> or the pencil; select several in a list to edit them together. A labels file (Settings) applies a whole set at once and is kept apart from your corrections, which always win.</p>
	<h3>Keys</h3>
	<p><kbd>Space</kbd> play or pause &middot; <kbd>n</kbd> next &middot; <kbd>p</kbd> previous &middot; <kbd>&larr;</kbd> <kbd>&rarr;</kbd> ten seconds back or on &middot; <kbd>s</kbd> shuffle again &middot; <kbd>/</kbd> search &middot; <kbd>q</kbd> queue &middot; <kbd>e</kbd> edit the playing track. In a list: <kbd>&uarr;</kbd> <kbd>&darr;</kbd> move, <kbd>Enter</kbd> play, <kbd>Shift</kbd>+<kbd>F10</kbd> or the menu key for more. Keys do nothing while the YouTube player itself has the focus.</p>
	<h3>What this page stores</h3>
	<p>Everything stays in this browser (IndexedDB): the imported lists as YouTube reports them, your labels, corrections, ratings, play counts, history, queue and stations. The sign-in token lasts an hour and stays in this tab. Nothing goes to this site. Cover art is loaded from YouTube's image server (i.ytimg.com) once you have a library; it can be switched off in Settings. &ldquo;Delete everything stored here&rdquo; removes all of it; &ldquo;Disconnect&rdquo; revokes this page's access to your YouTube account. YouTube data older than 30 days is refreshed when you next sign in.</p>
	<p>On a phone, playback stops when the screen locks: YouTube's player does that. The player stays visible while it plays, as YouTube's terms ask.</p>
	<p>This page uses YouTube API Services: <a href="https://www.youtube.com/t/terms" rel="noopener">YouTube Terms of Service</a> &middot; <a href="https://policies.google.com/privacy" rel="noopener">Google Privacy Policy</a> &middot; <a href="https://myaccount.google.com/permissions" rel="noopener">remove access at Google</a></p>
</template>

<script src="config.js"></script>
<script src="parse.js"></script>
<script src="library.js"></script>
<script src="shuffle.js"></script>
<script src="store.js"></script>
<script src="player.js"></script>
<script src="taxonomy.js"></script>
<script src="embed.js"></script>
<script src="discover.js"></script>
<script src="demo.js"></script>
<script src="yt.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
