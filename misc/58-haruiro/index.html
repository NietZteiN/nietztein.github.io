<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A Japanese poem by a watercolor shoreline. Read Haruiro or download the A3 art print.">
  <title>はるいろ · A poem by the sea</title>

  <style>
    @font-face {
      font-family: Poem;
      src: url("assets/poem-serif.ttf") format("truetype");
      font-display: swap;
      font-weight: 200;
    }

    :root {
      --ink: #263e3a;
      --muted: #68786f;
      --paper: #faf1e1;
      --edge: rgba(38, 62, 58, .2);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: #dfe5dc;
      font: 14px/1.5 system-ui, sans-serif;
      isolation: isolate;
    }

    button, a { -webkit-tap-highlight-color: transparent; }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    a { color: inherit; }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid #376a60;
      outline-offset: 5px;
    }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(90deg, #e1e7e0ee, #e6eadea6),
        url("assets/shore.png") center 62% / cover;
      filter: blur(2px);
      transform: scale(1.02);
    }

    header {
      max-width: 1660px;
      margin: auto;
      padding: 27px 4vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 17px;
      text-decoration: none;
    }

    .brand-name {
      font-family: Poem, "Yu Mincho", serif;
      font-weight: 200;
      font-size: 26px;
      letter-spacing: .17em;
    }

    .brand-note {
      padding-left: 17px;
      border-left: 1px solid var(--edge);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .2em;
      line-height: 1.8;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .views {
      display: flex;
      padding: 4px;
      border: 1px solid var(--edge);
      border-radius: 99px;
      background: #edf1e633;
    }

    .views button {
      padding: 8px 18px;
      border: 0;
      border-radius: 99px;
      background: transparent;
      font-size: 12px;
    }

    .views button[aria-pressed="true"] {
      background: var(--ink);
      color: #fcf4e5;
    }

    .download {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 3px;
      border-bottom: 1px solid var(--edge);
      font-size: 12px;
      text-decoration: none;
    }

    .download svg {
      width: 15px;
      height: 15px;
    }

    main {
      max-width: 1660px;
      margin: auto;
      padding: 12px 30px 54px;
      display: grid;
      grid-template-columns:
        minmax(120px, 1fr)
        minmax(400px, 760px)
        minmax(120px, 1fr);
      align-items: start;
      gap: 3vw;
    }

    .margin-note {
      position: sticky;
      top: 80px;
      padding-top: 110px;
      color: var(--muted);
    }

    .margin-note.left { padding-left: 2vw; }

    .vertical {
      margin: 0 0 42px;
      writing-mode: vertical-rl;
      font-family: Poem, "Yu Mincho", serif;
      font-weight: 200;
      font-size: 34px;
      letter-spacing: .4em;
      line-height: 1.8;
      color: #49645c;
    }

    .small {
      font-size: 10px;
      letter-spacing: .16em;
      line-height: 2;
      text-transform: uppercase;
    }

    .rule {
      width: 26px;
      height: 1px;
      margin: 20px 0;
      background: #8e9e92;
    }

    .right {
      justify-self: end;
      padding-right: 2vw;
    }

    .right p { max-width: 130px; }

    .art-wrap { width: 100%; }

    .paper {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 841.889764 / 1190.551181;
      overflow: hidden;
      background: var(--paper);
      box-shadow:
        0 8px 26px #233d3020,
        0 35px 80px #233d3016;
    }

    .paper text {
      font-family: Poem, "Yu Mincho", serif;
      font-weight: 200;
      fill: var(--ink);
    }

    .art-caption {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 20px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .reader {
      display: none;
      padding: 58px 56px 90px;
      background:
        linear-gradient(#faf3e8f7, #faf3e8ed 83%, #faf3e8d1);
      box-shadow: 0 15px 60px #233d300c;
    }

    .reading-label {
      margin: 0 0 35px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .reader .stanza {
      margin: 0 0 42px;
      font-family: Poem, "Yu Mincho", serif;
      font-weight: 200;
      font-size: 21px;
      line-height: 2.6;
      letter-spacing: .07em;
    }

    .reader .stanza:last-child { margin-bottom: 0; }

    .reader .line {
      display: block;
      overflow-wrap: anywhere;
    }

    .reader .stanza:first-of-type .line:first-child {
      margin-bottom: 20px;
      font-size: 25px;
    }

    body[data-view="read"] .art-wrap { display: none; }
    body[data-view="read"] .reader { display: block; }

    .petals {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .petal {
      position: absolute;
      top: -5vh;
      left: var(--x);
      width: var(--s);
      height: calc(var(--s) * .65);
      border-radius: 65% 0 65% 30%;
      background: #dcb7ad;
      opacity: 0;
      filter: blur(.2px);
      animation: drift var(--d) linear var(--delay) infinite;
    }

    @keyframes drift {
      0% {
        transform: translate3d(0, -5vh, 0) rotate(15deg);
        opacity: 0;
      }
      12% { opacity: .42; }
      85% { opacity: .3; }
      100% {
        transform: translate3d(100px, 110vh, 0) rotate(390deg);
        opacity: 0;
      }
    }

    body.motion-off .petals { visibility: hidden; }
    body.motion-off .petal { animation-play-state: paused; }

    footer {
      max-width: 1660px;
      margin: auto;
      padding: 0 4vw 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: var(--muted);
      font-size: 11px;
    }

    .motion-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8b9b79;
      box-shadow: 0 0 0 3px #8b9b7920;
    }

    .motion-toggle[aria-pressed="false"] .dot {
      background: #a7ada3;
      box-shadow: none;
    }

    @media (min-width: 1500px) {
      main { grid-template-columns: 1fr 790px 1fr; }
    }

    @media (max-width: 1000px) {
      main {
        grid-template-columns: 1fr minmax(380px, 650px) 1fr;
        gap: 15px;
      }

      .margin-note { padding-top: 70px; }
      .vertical { font-size: 25px; }
      .right p { max-width: 80px; }
      .brand-note { display: none; }
      .reader { padding: 42px 32px; }
    }

    @media (max-width: 700px) {
      header {
        padding: 20px;
        flex-wrap: wrap;
        gap: 16px;
      }

      .brand-name { font-size: 23px; }

      .brand-note {
        display: block;
        font-size: 8px;
      }

      nav {
        width: 100%;
        justify-content: space-between;
      }

      .views button { padding: 7px 19px; }

      main {
        display: block;
        padding: 4px 16px 35px;
      }

      .margin-note { display: none; }
      .reader { padding: 37px 24px 50px; }

      .reader .stanza {
        margin-bottom: 30px;
        font-size: 18px;
        line-height: 2.35;
        letter-spacing: .045em;
      }

      .reader .line { margin-bottom: 8px; }

      .art-caption {
        font-size: 8px;
        letter-spacing: .08em;
      }

      footer {
        padding: 0 20px 20px;
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .petal { animation: none; display: none; }
    }

    @page {
      size: A3 portrait;
      margin: 0;
    }

    @media print {
      html, body {
        width: 297mm;
        height: 420mm;
        margin: 0;
        padding: 0;
        background: none;
      }

      .ambient, .petals, header, footer,
      .margin-note, .reader, .art-caption {
        display: none !important;
      }

      main {
        display: block;
        max-width: none;
        margin: 0;
        padding: 0;
      }

      .art-wrap {
        display: block !important;
        width: 297mm;
      }

      .paper {
        width: 297mm;
        height: 420mm;
        box-shadow: none;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
    }
  </style>
</head>

<body data-view="art">
  <div class="ambient" aria-hidden="true"></div>
  <div class="petals" aria-hidden="true"></div>

  <header>
    <a class="brand" href="../../#/misc" aria-label="Back to the site">
      <span class="brand-name" lang="ja">はるいろ</span>
      <span class="brand-note">Words by<br>the water</span>
    </a>

    <nav aria-label="Presentation controls">
      <div class="views">
        <button
          id="art-button"
          aria-pressed="true"
          aria-controls="art-view"
        >Art print</button>

        <button
          id="read-button"
          aria-pressed="false"
          aria-controls="read-view"
        >Read</button>
      </div>

      <a class="download" href="Haruiro-Art-Print-A3.pdf" download>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          aria-hidden="true"
        >
          <path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/>
        </svg>
        Download print
      </a>
    </nav>
  </header>

  <main>
    <aside class="margin-note left" aria-hidden="true">
      <p class="vertical" lang="ja">風景と、<br>わたし。</p>
      <div class="rule"></div>
      <p class="small">Seafoam<br>Cherry blossoms<br>Words</p>
    </aside>

    <section
      class="art-wrap"
      id="art-view"
      aria-label="Japanese poetry art print"
    >
      <svg
        class="paper"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 841.889764 1190.551181"
        role="img"
        aria-labelledby="poster-title poster-desc"
        lang="ja"
      >
        <title id="poster-title">仮象のはるいろそらいちめん</title>

        <desc id="poster-desc">
          Japanese poetry on a watercolor shore with cherry blossoms.
          Choose Read to access the poem as text.
        </desc>

        <image
          href="assets/shore.png"
          width="841.889764"
          height="1190.551181"
          preserveAspectRatio="none"
        />

        <g id="poster-lines"></g>
      </svg>

      <div class="art-caption">
        <span>はるいろ · Art print</span>
        <span>A3 · 297 × 420 mm</span>
      </div>
    </section>

    <section
      class="reader"
      id="read-view"
      aria-label="Poem reading view"
      lang="ja"
    >
      <div class="reading-label" lang="en">Words by the water</div>
      <div id="reading-lines"></div>
    </section>

    <aside class="margin-note right">
      <p class="small">A quiet<br>reading space.</p>
      <div class="rule"></div>
      <p style="font-size:11px;line-height:1.9">
        A watercolor shoreline.<br>
        A little room for words.
      </p>
    </aside>
  </main>

  <footer>
    <span><a href="../../#/misc">Back to Misc</a></span>

    <button class="motion-toggle" id="motion-button" aria-pressed="true">
      <span class="dot" aria-hidden="true"></span>
      <span id="motion-label">Motion on</span>
    </button>
  </footer>

  <script>
    const poem = [
      "仮象のはるいろそらいちめん",
      "ただやみくもの因果的交流電燈",
      "明るく明るく明るく灯ります",
      "WATERMELONの電気石音と言語の交差地点",
      "ますます色彩過多の世界にて",
      "七つの櫻が追い越した",
      "わたしめがけて追い越した",
      "ふうけいより先にわたしはなく",
      "わたしより先にふうけいはなく",
      "追いかけ追いつきいなくなる",
      "ふわふわとつつまれ世界は消えていく",
      "ふわふわの櫻の森で世界が鳴った",
      "美しい音色で世界が鳴った",
      "それが虚無ならば虚無自身がこのとほりで",
      "ある程度まではみんなに共通いたします",
      "すべてがわたくしの中のみんなであるやうに",
      "みんなのおのおののなかのすべてですから」"
    ];

    const positions = [
      [198.645, 103, 24, 1.55],
      [264.870, 144, 18, 1.55],
      [301.645, 177, 18, 1.55],
      [248.815, 210, 15.5, 1.1],
      [332.645, 243, 18, 1.55],
      [387.970, 276, 18, 1.55],
      [371.420, 309, 18, 1.55],
      [356.870, 342, 18, 1.55],
      [362.870, 375, 18, 1.55],
      [351.645, 408, 18, 1.55],
      [280.545, 441, 18, 1.55],
      [253.095, 474, 18, 1.55],
      [248.420, 507, 18, 1.55],
      [188.995, 540, 18, 1.55],
      [227.770, 573, 18, 1.55],
      [239.220, 606, 18, 1.55],
      [261.220, 639, 18, 1.55]
    ];

    const poster = document.querySelector("#poster-lines");

    poem.forEach((line, index) => {
      const [x, y, size, spacing] = positions[index];
      const text = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "text"
      );

      text.setAttribute("x", x);
      text.setAttribute("y", y);
      text.setAttribute("font-size", size);
      text.setAttribute("letter-spacing", spacing);
      text.textContent = line;
      poster.append(text);
    });

    const reader = document.querySelector("#reading-lines");
    const groups = [[0, 3], [3, 5], [5, 10], [10, 13], [13, 17]];

    groups.forEach(([start, end]) => {
      const stanza = document.createElement("p");
      stanza.className = "stanza";

      poem.slice(start, end).forEach(line => {
        const span = document.createElement("span");
        span.className = "line";
        span.textContent = line;
        stanza.append(span);
      });

      reader.append(stanza);
    });

    const artButton = document.querySelector("#art-button");
    const readButton = document.querySelector("#read-button");

    function setView(view) {
      document.body.dataset.view = view;
      artButton.setAttribute("aria-pressed", String(view === "art"));
      readButton.setAttribute("aria-pressed", String(view === "read"));
    }

    artButton.addEventListener("click", () => setView("art"));
    readButton.addEventListener("click", () => setView("read"));

    if (matchMedia("(max-width:700px)").matches) {
      setView("read");
    }

    const motionButton = document.querySelector("#motion-button");
    const motionLabel = document.querySelector("#motion-label");

    let motion = !matchMedia(
      "(prefers-reduced-motion:reduce)"
    ).matches;

    function updateMotion() {
      document.body.classList.toggle("motion-off", !motion);
      motionButton.setAttribute("aria-pressed", String(motion));
      motionLabel.textContent = motion ? "Motion on" : "Motion off";
    }

    motionButton.addEventListener("click", () => {
      motion = !motion;
      updateMotion();
    });

    updateMotion();

    const petalField = document.querySelector(".petals");

    for (let i = 0; i < 9; i++) {
      const petal = document.createElement("span");
      petal.className = "petal";
      petal.style.setProperty("--x", `${i * 13 - 4}%`);
      petal.style.setProperty("--s", `${9 + (i % 4) * 3}px`);
      petal.style.setProperty("--d", `${27 + i * 3}s`);
      petal.style.setProperty("--delay", `${-i * 4}s`);
      petalField.append(petal);
    }
  </script>
</body>
</html>
