<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex">
	<title>Page not found · Jack V. Le</title>
	<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
	<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
	<script>
		(function () {
			var t = null;
			try { t = localStorage.getItem('theme'); } catch (e) { }
			if (t !== 'light' && t !== 'dark') {
				t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			}
			document.documentElement.setAttribute('data-theme', t);
		})();
	</script>
	<style>
		:root {
			--bg: #ffffff;
			--text: #1b1f24;
			--text-2: #5f6873;
			--heading: #0d1117;
			--border: #e2e5e9;
			--accent: #1f5fd6;
			--accent-ring: rgba(31, 95, 214, 0.35);
			color-scheme: light;
		}

		:root[data-theme="dark"] {
			--bg: #0f1115;
			--text: #d5dae2;
			--text-2: #9aa3af;
			--heading: #f3f5f8;
			--border: #262c35;
			--accent: #7cb3ff;
			--accent-ring: rgba(124, 179, 255, 0.40);
			color-scheme: dark;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			background: var(--bg);
			color: var(--text);
			font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
			-webkit-font-smoothing: antialiased;
		}

		main {
			max-width: 34rem;
		}

		.code {
			font-family: 'JetBrains Mono', 'Lucida Console', ui-monospace, monospace;
			font-size: .9rem;
			color: var(--accent);
			margin: 0 0 .75rem;
		}

		h1 {
			margin: 0 0 .75rem;
			color: var(--heading);
			font-size: 2rem;
			font-weight: 600;
			letter-spacing: -0.02em;
		}

		p {
			margin: 0 0 1.5rem;
			color: var(--text-2);
			line-height: 1.6;
		}

		a.home {
			display: inline-block;
			padding: .6rem 1rem;
			border: 1px solid var(--border);
			border-radius: 10px;
			color: var(--heading);
			font-weight: 500;
			text-decoration: none;
		}

		a.home:hover {
			border-color: var(--accent);
			color: var(--accent);
		}

		a.home:focus-visible {
			outline: none;
			box-shadow: 0 0 0 3px var(--accent-ring);
		}
	</style>
</head>

<body>
	<main>
		<p class="code">404</p>
		<h1>There is no page here.</h1>
		<p>The address may be mistyped, or the page may have moved. Everything on this site is reachable from the
			home page.</p>
		<a class="home" href="/">Back to Jack V. Le’s home page</a>
	</main>
</body>

</html>
