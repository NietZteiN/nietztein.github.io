<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake Paper Titles</title>
<meta name="description" content="A Markov chain trained on real arXiv titles, and a linter that scores how cliché a title is.">
<style>
  :root {
    --bg: #14151a;

    --good: #6cc48f;
    --mid: #f2c14e;

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif", serif;
    padding: 32px 16px 64px;

  .wrap { max-width: 860px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 { font-size: 34px; line-height: 1.15; margin: 0 0 6px; font-weight: 600; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0; font-size: 15px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin: 0 0 12px; font-weight: 600;
       font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; margin-bottom: 16px;
              font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; }
  .controls label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  select, input[type=number] {
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit;
  }
  input[type=range] { accent-color: var(--accent); width: 120px; }
  input[type=number] { width: 80px; }
  button.big {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px;
    font: 600 20px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 16px 28px; cursor: pointer; width: 100%; transition: transform 80ms ease, filter 120ms ease;
  }
  button.big:hover { filter: brightness(1.06); }
  button.big:active { transform: scale(0.99); }
  ol.titles { list-style: none; margin: 18px 0 0; padding: 0; }
  ol.titles li {
    display: flex; gap: 14px; align-items: baseline; padding: 10px 8px; border-top: 1px solid var(--line); cursor: pointer;
    border-radius: 6px;
  }
  ol.titles li:hover { background: var(--panel-2); }
  ol.titles li:first-child { border-top: 0; }
  ol.titles .t { flex: 1; font-size: 18px; }
  ol.titles .badge {
    font: 600 12px/1 ui-sans-serif, system-ui, sans-serif; min-width: 34px; text-align: center; padding: 5px 6px; border-radius: 999px;
    color: var(--bg); background: var(--good);
  }
  .hint { color: var(--muted); font-size: 13px; margin-top: 10px;
          font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  textarea {
    width: 100%; min-height: 64px; resize: vertical; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; font: 18px/1.4 inherit; font-family: inherit;
  }
  textarea:focus, select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .bar { height: 14px; background: var(--panel-2); border-radius: 999px; overflow: hidden; margin: 14px 0 8px; border: 1px solid var(--line); }
  .bar > div { height: 100%; width: 0; background: var(--good); transition: width 180ms ease, background 180ms ease; }
  .score { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
           font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .score b { font-size: 28px; font-weight: 700; }
  .score .verdict { color: var(--muted); font-size: 14px; text-align: right; }
  ul.rules { list-style: none; padding: 0; margin: 12px 0 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; }
  ul.rules li { display: flex; gap: 12px; padding: 4px 0; border-top: 1px dashed var(--line); }
  ul.rules li:first-child { border-top: 0; }
  ul.rules .pts { color: var(--accent); min-width: 36px; font-variant-numeric: tabular-nums; font-weight: 600; }
  footer { color: var(--muted); font-size: 13px; text-align: center;
           font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (max-width: 520px) {
    h1 { font-size: 27px; }
    ol.titles .t { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fake Paper <span>Titles</span></h1>
    <p class="sub">A two-word Markov chain trained on real arXiv titles, plus a linter that scores how cliché a title is. Nothing here leaves your browser.</p>
  </header>

  <section>
    <h2>Generate</h2>
    <div class="controls">
      <label>Topic
        <select id="topic">
          <option value="">any</option>
          <option value="interp">interpretability</option>
          <option value="unlearning">unlearning</option>
          <option value="code">code</option>
          <option value="watermark">watermarking</option>
        </select>
      </label>
      <label>Temperature <input id="temp" type="range" min="0.3" max="1.6" step="0.1" value="0.9"> <span id="tempv">0.9</span></label>
      <label>Seed <input id="seed" type="number" placeholder="random"></label>
    </div>
    <button class="big" id="go">Generate ten titles</button>
    <ol class="titles" id="list"></ol>
    <p class="hint">Click a title to send it to the linter. The badge is its cliché score.</p>
  </section>

  <section>
    <h2>Lint a title</h2>
    <textarea id="lint" spellcheck="false" placeholder="Towards Rethinking X: A Y Approach"></textarea>
    <div class="bar"><div id="barfill"></div></div>
    <div class="score"><b id="scorev">0</b><span class="verdict" id="verdict"></span></div>
    <ul class="rules" id="rules"></ul>
  </section>

  <footer id="foot"></footer>
</div>

// ---------------------------------------------------------------- shared bits
const START = "\u0002", END = "\u0003";
const MAX_BODY = 14, SOFT_BODY = 9, MAX_PREFIX = 10;
const DANGLING = new Set(["a","an","and","as","at","by","for","from","in","into","is","of","on","or","the","to","via",
  "with","without","through","using","over","under","between","are","its","their","vs.","vs","&","than","that","when","how","why","what"]);
const QUESTION_WORDS = new Set(["Can","Do","Does","Is","Are","What","How","Why","When","Where","Should","Will"]);
const TOPICS = {
  interp: ["interpretab","mechanistic","circuit","probing","probe","attention head","neuron","sparse autoencoder","activation",
           "patching","attribution","explanation","explaining","monosemantic","features","saliency","dictionary learning"],
  unlearning: ["unlearn","forget","removal","erasing","editing","memorization","delete"],
  code: ["code","program","software","github","source","obfusc","bug","copilot","repository"],
  watermark: ["watermark","detect","provenance","ai-generated","machine-generated","radioactive"],
};

const keyOf = t => t.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const hasKeyword = (text, words) => { const low = text.toLowerCase(); return words.some(w => low.includes(w)); };

function splitColon(title) {
  if (title.includes(":")) {
    const i = title.indexOf(":");
    const prefix = title.slice(0, i).split(/\s+/).filter(Boolean);
    const body = title.slice(i + 1).split(/\s+/).filter(Boolean);
    if (prefix.length > 0 && prefix.length <= MAX_PREFIX && body.length) return [prefix, body];
  }
  // No usable prefix: drop stray colons so the body chain never emits one.
  return [[], title.split(/\s+/).filter(w => w && w !== ":").map(w => w.replace(/:/g, ""))];
}

// Small seedable RNG (mulberry32) so a seed reproduces a list.
function makeRng(seed) {
  let a = (seed === null || seed === undefined || seed === "") ? (Math.random() * 2 ** 32) >>> 0 : (Number(seed) >>> 0);
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// counter: Map of key -> count
function weightedChoice(rng, counter, temperature) {
  const keys = [...counter.keys()];
  if (temperature <= 0) return keys.reduce((b, k) => counter.get(k) > counter.get(b) ? k : b, keys[0]);
  const weights = keys.map(k => Math.pow(counter.get(k), 1 / temperature));
  const total = weights.reduce((s, w) => s + w, 0);
  let r = rng() * total;
  for (let i = 0; i < keys.length; i++) { r -= weights[i]; if (r <= 0) return keys[i]; }
  return keys[keys.length - 1];
}
const bump = (map, k, n = 1) => map.set(k, (map.get(k) || 0) + n);
const pairKey = (a, b) => a + "\u0001" + b;

// ---------------------------------------------------------------- Markov chain
class Chain {
  constructor() { this.two = new Map(); this.one = new Map(); }
  add(words) {
    const seq = [START, START, ...words, END];
    for (let i = 2; i < seq.length; i++) {
      const a = seq[i - 2], b = seq[i - 1], c = seq[i];
      if (!this.two.has(pairKey(a, b))) this.two.set(pairKey(a, b), new Map());
      bump(this.two.get(pairKey(a, b)), c);
      if (!this.one.has(b)) this.one.set(b, new Map());
      bump(this.one.get(b), c);
    }
  }
  options(a, b) { return this.two.get(pairKey(a, b)) || this.one.get(b); }
  walk(rng, temperature, start = [START, START], hard = MAX_BODY, soft = SOFT_BODY) {
    const words = start.filter(w => w !== START);
    let [a, b] = start, ended = false;
    while (words.length < hard) {
      let opts = this.options(a, b);
      if (!opts) break;
      if (words.length >= soft && opts.has(END)) { opts = new Map(opts); opts.set(END, opts.get(END) * 3); }
      const c = weightedChoice(rng, opts, temperature);
      if (c === END) { ended = true; break; }
      words.push(c); a = b; b = c;
    }
    while (words.length && DANGLING.has(words[words.length - 1].toLowerCase())) words.pop();
    return [words, ended];
  }
}

// ---------------------------------------------------------------- title model
function balanced(text) {
  const stack = [], pairs = { ")": "(", "]": "[", "}": "{" };
  for (const ch of text) {
    if ("([{".includes(ch)) stack.push(ch);
    else if (pairs[ch]) { if (!stack.length || stack.pop() !== pairs[ch]) return false; }
  }
  return stack.length === 0 && (text.split('"').length - 1) % 2 === 0;
}
const stripBrackets = t => t.replace(/[()\[\]{}"]/g, "").replace(/\s+/g, " ").trim();
function fixCase(text) {
  return text.split(": ").map(p => { p = p.trim(); return p ? p[0].toUpperCase() + p.slice(1) : p; }).join(": ");
}

class TitleModel {
  constructor(titles) {
    this.titles = titles; this.body = new Chain(); this.prefix = new Chain();
    this.colonCount = 0; this.prefixLengths = new Map(); this.openers = new Map();
    this.openersByTitle = []; this.known = new Set();
    for (const title of titles) {
      const [prefix, body] = splitColon(title);
      this.body.add(body);
      this.known.add(keyOf(title)); this.known.add(keyOf(body.join(" ")));
      const opener = body.length >= 2 ? [body[0], body[1]] : [START, body[0]];
      bump(this.openers, pairKey(...opener));
      this.openersByTitle.push(pairKey(...opener));
      if (prefix.length) { this.colonCount++; bump(this.prefixLengths, prefix.length); this.prefix.add(prefix); }
    }
  }
  get colonProb() { return this.colonCount / Math.max(1, this.titles.length); }
  isKnown(text) { return this.known.has(keyOf(text)); }

  pickOpener(rng, temperature, topic) {
    if (topic) {
      const words = TOPICS[topic];
      let biased = new Map();
      this.titles.forEach((t, i) => { if (hasKeyword(t, words)) bump(biased, this.openersByTitle[i]); });
      if (rng() < 0.5) {
        const inside = new Map();
        for (const [k, nxt] of this.body.two) {
          const [a, b] = k.split("\u0001");
          if (a !== START && /^[A-Z]/.test(a) && hasKeyword(a + " " + b, words)) {
            bump(inside, k, [...nxt.values()].reduce((s, v) => s + v, 0));
          }
        }
        if (inside.size) biased = inside;
      }
      if (biased.size) return weightedChoice(rng, biased, temperature).split("\u0001");
    }
    return weightedChoice(rng, this.openers, temperature).split("\u0001");
  }

  draft(rng, temperature, topic) {
    const [body, ended] = this.body.walk(rng, temperature, this.pickOpener(rng, temperature, topic));
    let text = body.join(" ");
    if (this.prefixLengths.size && rng() < this.colonProb) {
      const length = Number(weightedChoice(rng, this.prefixLengths, temperature));
      for (let i = 0; i < 6; i++) {
        const [prefix, complete] = this.prefix.walk(rng, temperature, [START, START], MAX_PREFIX, length);
        if (prefix.length && complete) { text = prefix.join(" ") + ": " + text; break; }
      }
    }
    return [fixCase(text), ended];
  }

  generate(rng, temperature, topic, tries = 40) {
    let last = "";
    for (let i = 0; i < tries; i++) {
      const [text, ended] = this.draft(rng, temperature, topic);
      last = text;
      const body = splitColon(text)[1];
      if (body.length < 3 || this.isKnown(text) || !ended || !balanced(text)) continue;
      if (QUESTION_WORDS.has(body[0]) && !text.endsWith("?")) continue;
      if (topic && !hasKeyword(text, TOPICS[topic])) continue;
      if (text.includes(":") && this.isKnown(text.slice(text.indexOf(":") + 1))) continue;
      return text;
    }
    return stripBrackets(last);
  }

  generateMany(n, seed, temperature, topic) {
    const rng = makeRng(seed), out = [], seen = new Set();
    let guard = 0;
    while (out.length < n && guard++ < n * 20) {
      const t = this.generate(rng, temperature, topic);
      if (!seen.has(keyOf(t))) { seen.add(keyOf(t)); out.push(t); }
    }
    return out;
  }
}

// ---------------------------------------------------------------- linter
const OPENERS = [["Towards",15],["Toward",12],["Rethinking",15],["Revisiting",12],["Beyond",12],["Unveiling",15],
  ["Demystifying",15],["On the",8],["A Simple",10],["Understanding",8],["Exploring",8],["Do ",6],["Can ",6],["Why ",6],["What ",6],["When ",6]];
const BUZZWORDS = new Set(["llm","llms","transformer","transformers","efficient","robust","scalable","unified","novel","foundation","emergent"]);
const KNOWN_ACRONYMS = new Set(["NLP","LLM","LLMS","GPT","BERT","AI","ML","RNN","CNN","LSTM","MT","QA","NER","RL","RLHF","CLIP"]);
const VERDICTS = [[15,"Refreshingly plain. A reviewer might not notice it."],[35,"Mild. A few tropes, none that a reviewer would flag."],
  [55,"Solidly on trend. Could be from any recent workshop."],[75,"Heavily seasoned. The template is showing through."],
  [101,"Peak cliché. The title writes the paper for you."]];

function lint(title) {
  title = title.replace(/\s+/g, " ").trim();
  const rules = [], words = title.split(" ").filter(Boolean), low = title.toLowerCase();
  if (!title) return { score: 0, rules, verdict: "" };

  const clauses = [title, ...title.split(":").slice(1).map(c => c.trim())];
  clauses.forEach((clause, ci) => {
    let where = ci === 0 ? "" : " after the colon", rest = clause;
    for (let k = 0; k < 2; k++) {
      const hit = OPENERS.find(([o]) => rest.toLowerCase().startsWith(o.toLowerCase()));
      if (!hit) break;
      rules.push([hit[1], `opener "${hit[0].trim()}"${where}`]);
      rest = rest.slice(hit[0].length).trim(); where = " stacked on it";
    }
  });

  if (title.includes(":")) {
    rules.push([10, "colon present"]);
    const n = title.split(":")[0].split(" ").filter(Boolean).length;
    if (n === 1) rules.push([8, "one-word name before the colon"]);
    else if (n <= 4) rules.push([4, `prefix of ${n} words before the colon`]);
    else rules.push([2, `long prefix of ${n} words before the colon`]);
    const colons = title.split(":").length - 1;
    if (colons > 1) rules.push([10, `${colons} colons`]);
  }

  for (const w of words) {
    const segments = w.split(/[^A-Za-z]+/).filter(Boolean);
    if (segments.some(s => /[a-z][A-Z]/.test(s))) { rules.push([12, `cute acronym "${w.replace(/[:,]+$/, "")}"`]); break; }
    const core = segments.join("");
    if (w.endsWith(":") && core.length >= 3 && core === core.toUpperCase() && !KNOWN_ACRONYMS.has(core)) {
      rules.push([8, `all-caps name "${core}" before the colon`]); break;
    }
  }

  if (title.includes("?")) rules.push([8, "question mark"]);
  if (low.includes("all you need")) {
    rules.push([15, '"All You Need"']);
    if (/\b(is|are) all you need/.test(low)) rules.push([5, '"is All You Need" in full']);
  }
  if (low.includes("large language model")) rules.push([8, '"Large Language Models"']);
  if (low.includes("a survey") || low.startsWith("survey")) rules.push([10, '"A Survey"']);
  if (low.includes("benchmark")) rules.push([8, '"Benchmark"']);
  if (/\bvia\b/.test(low)) rules.push([6, '"via"']);
  if (/\bmeets?\b/.test(low)) rules.push([10, '"Meets"']);
  if (/\bapproach\b/.test(low)) rules.push([5, '"Approach"']);

  const hits = low.split(" ").map(t => t.replace(/[^a-z0-9]/g, "")).filter(t => BUZZWORDS.has(t));
  if (hits.length) rules.push([Math.min(20, 5 * hits.length), `buzzwords ${hits.length}/${words.length}: ${hits.join(", ")}`]);

  const n = words.length;
  if (n > 20) rules.push([12, `${n} words, an abstract in disguise`]);
  else if (n > 15) rules.push([8, `${n} words is long`]);
  else if (n <= 2) rules.push([6, `${n}-word title, the monolith`]);

  const score = Math.min(100, rules.reduce((s, r) => s + r[0], 0));
  return { score, rules, verdict: VERDICTS.find(v => score < v[0])[1] };
}

// ---------------------------------------------------------------- UI
const $ = id => document.getElementById(id);
const model = new TitleModel(TITLES);
const colorFor = s => s < 35 ? "var(--good)" : s < 60 ? "var(--mid)" : "var(--bad)";

function renderTitles() {
  const topic = $("topic").value || null;
  const temperature = Number($("temp").value);
  const seed = $("seed").value;
  const list = $("list");
  list.innerHTML = "";
  for (const t of model.generateMany(10, seed, temperature, topic)) {
    const li = document.createElement("li");
    const span = document.createElement("span"); span.className = "t"; span.textContent = t;
    const badge = document.createElement("span"); badge.className = "badge";
    const s = lint(t).score; badge.textContent = s; badge.style.background = colorFor(s);
    li.append(span, badge);
    li.addEventListener("click", () => { $("lint").value = t; renderLint(); $("lint").focus(); });
    list.appendChild(li);
  }
}

function renderLint() {
  const res = lint($("lint").value);
  $("barfill").style.width = res.score + "%";
  $("barfill").style.background = colorFor(res.score);
  $("scorev").textContent = res.score;
  $("verdict").textContent = res.verdict;
  const ul = $("rules"); ul.innerHTML = "";
  for (const [pts, msg] of res.rules) {
    const li = document.createElement("li");
    const p = document.createElement("span"); p.className = "pts"; p.textContent = "+" + pts;
    const m = document.createElement("span"); m.textContent = msg;
    li.append(p, m); ul.appendChild(li);
  }
}

$("go").addEventListener("click", renderTitles);
$("temp").addEventListener("input", () => { $("tempv").textContent = Number($("temp").value).toFixed(1); });
$("lint").addEventListener("input", renderLint);
$("foot").textContent = `Trained on ${TITLES.length} real titles. Rebuild with python3 titles.py build-page after collecting more.`;
renderTitles();
renderLint();
</script>
</body>
</html>
